<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0060AF"/>
      <stop offset="60%" stopColor="#0284C7"/>
      <stop offset="100%" stopColor="#38BDF8"/>
    </linearGradient>

    <!-- Dumpster Container Gradient -->
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#004C8C"/>
      <stop offset="100%" stopColor="#002D54"/>
    </linearGradient>

    <!-- Truck Cab Gradient -->
    <linearGradient id="cabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#E2E8F0"/>
    </linearGradient>

    <!-- Wheel Gradient -->
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#64748B"/>
      <stop offset="60%" stopColor="#334155"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </radialGradient>

    <!-- Rim Gradient -->
    <radialGradient id="rimGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="60%" stopColor="#CBD5E1"/>
      <stop offset="100%" stopColor="#94A3B8"/>
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001833" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="64" cy="98" rx="46" ry="7" fill="#000000" opacity="0.15" filter="blur(3px)"/>

  <!-- Truck Chassis Rails & Underbody -->
  <rect x="18" y="78" width="88" height="6" rx="2" fill="#334155"/>
  <rect x="22" y="82" width="18" height="5" rx="1" fill="#475569"/>
  <rect x="52" y="82" width="22" height="5" rx="1" fill="#475569"/>

  <!-- Hydraulic Roll-Off Hoist Arm -->
  <path d="M22 79 L42 66 L44 68 L24 81 Z" fill="#64748B"/>
  <circle cx="23" cy="80" r="2" fill="#94A3B8"/>
  <circle cx="43" cy="67" r="2" fill="#94A3B8"/>

  <!-- Roll-Off Dumpster Container -->
  <g filter="url(#softShadow)">
    <!-- Container Body -->
    <path d="M14 44 L20 76 L74 76 L76 44 Z" fill="url(#binGrad)"/>
    
    <!-- Top Reinforced Rim -->
    <path d="M12 42 L78 42 L77 46 L13 46 Z" fill="#0060AF"/>
    
    <!-- Container Side Ribs / Structural Posts -->
    <line x1="28" y1="46" x2="31" y2="76" stroke="#0060AF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="46" x2="46" y2="76" stroke="#0060AF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="46" x2="61" y2="76" stroke="#0060AF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Front Tarp Shield / Overhang -->
    <path d="M74 44 L80 44 L78 49 L74 49 Z" fill="#0284C7"/>

    <!-- Roll-Off Steel Rollers at Back -->
    <circle cx="17" cy="77" r="2.5" fill="#94A3B8"/>
    <circle cx="17" cy="77" r="1" fill="#475569"/>
  </g>

  <!-- Truck Driver Cab -->
  <g filter="url(#softShadow)">
    <!-- Cab Body Main Block -->
    <path d="M78 52 L94 52 C98 52 101 55 103 59 L109 68 C110.5 70.5 111 72.5 111 75 L111 82 C111 83.5 110 84.5 108.5 84.5 L78 84.5 Z" fill="url(#cabGrad)"/>
    
    <!-- Front Bumper -->
    <rect x="106" y="80" width="7" height="4.5" rx="1.5" fill="#334155"/>
    <rect x="109" y="81" width="3.5" height="2" rx="0.5" fill="#E2E8F0"/>

    <!-- Headlight -->
    <path d="M109 75.5 L111 75.5 L111 78.5 L108.5 78.5 Z" fill="#FACC15"/>
    <circle cx="109.5" cy="77" r="1" fill="#FEF08A"/>

    <!-- Windshield & Side Window -->
    <path d="M82 56 L94 56 C96.5 56 98.5 58 100 61 L104 68 L82 68 Z" fill="#0284C7" opacity="0.85"/>
    <path d="M84 58 L93 58 L98 66 L84 66 Z" fill="#38BDF8" opacity="0.4"/>

    <!-- Door Line & Handle -->
    <line x1="82" y1="69" x2="82" y2="82" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="97" y1="69" x2="97" y2="82" stroke="#94A3B8" stroke-width="1.2"/>
    <rect x="85" y="72" width="3.5" height="1.2" rx="0.6" fill="#475569"/>

    <!-- Side View Mirror -->
    <rect x="100.5" y="62" width="2" height="6" rx="0.8" fill="#1E293B"/>
    <line x1="99" y1="64" x2="100.5" y2="64" stroke="#475569" stroke-width="1"/>

    <!-- Cab Steps -->
    <rect x="80" y="82" width="16" height="2" fill="#64748B"/>
  </g>

  <!-- Heavy Duty Wheels & Tires -->
  <!-- Rear Dual Axle 1 -->
  <g>
    <circle cx="32" cy="85" r="11" fill="url(#wheelGrad)"/>
    <circle cx="32" cy="85" r="7" fill="url(#rimGrad)"/>
    <circle cx="32" cy="85" r="3" fill="#334155"/>
    <circle cx="32" cy="85" r="1" fill="#FFFFFF"/>
    <!-- Lug Nuts -->
    <circle cx="32" cy="81" r="0.7" fill="#64748B"/>
    <circle cx="32" cy="89" r="0.7" fill="#64748B"/>
    <circle cx="28" cy="85" r="0.7" fill="#64748B"/>
    <circle cx="36" cy="85" r="0.7" fill="#64748B"/>
  </g>

  <!-- Rear Dual Axle 2 -->
  <g>
    <circle cx="56" cy="85" r="11" fill="url(#wheelGrad)"/>
    <circle cx="56" cy="85" r="7" fill="url(#rimGrad)"/>
    <circle cx="56" cy="85" r="3" fill="#334155"/>
    <circle cx="56" cy="85" r="1" fill="#FFFFFF"/>
    <!-- Lug Nuts -->
    <circle cx="56" cy="81" r="0.7" fill="#64748B"/>
    <circle cx="56" cy="89" r="0.7" fill="#64748B"/>
    <circle cx="52" cy="85" r="0.7" fill="#64748B"/>
    <circle cx="60" cy="85" r="0.7" fill="#64748B"/>
  </g>

  <!-- Front Steering Axle -->
  <g>
    <circle cx="98" cy="85" r="11" fill="url(#wheelGrad)"/>
    <circle cx="98" cy="85" r="7" fill="url(#rimGrad)"/>
    <circle cx="98" cy="85" r="3" fill="#334155"/>
    <circle cx="98" cy="85" r="1" fill="#FFFFFF"/>
    <!-- Lug Nuts -->
    <circle cx="98" cy="81" r="0.7" fill="#64748B"/>
    <circle cx="98" cy="89" r="0.7" fill="#64748B"/>
    <circle cx="94" cy="85" r="0.7" fill="#64748B"/>
    <circle cx="102" cy="85" r="0.7" fill="#64748B"/>
  </g>

  <!-- Gloss Highlight across the image -->
  <path d="M14 44 L76 44 L70 52 L16 52 Z" fill="#FFFFFF" opacity="0.12"/>
</svg>
